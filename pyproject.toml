[project]
name = "dummy-gpt"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "" }
]
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.0",
    "fastapi[standard]>=0.142.2",
    "sqlmodel>=0.0.47",
]

[project.optional-dependencies]
torch = [
    "numpy>=1.26",
    "tokenizers>=0.15",
    "torch>=2.4",
]
# Windows-only: System Media Transport Controls, used by
# experiments/sleep-timer/sleep-timer-app-win.py to pause playback before
# suspending. Kept out of the default deps so `uv sync` still works on
# macOS/Linux.
sleep-timer = [
    "sv-ttk>=2.6.1",
    "winrt-windows-foundation>=3.2.1",
    "winrt-windows-foundation-collections>=3.2.1",
    "winrt-windows-media-control>=3.2.1",
]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
